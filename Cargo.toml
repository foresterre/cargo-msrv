[package]
name = "cargo-msrv"
description = "Find your minimum supported Rust version (MSRV)!"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

rust-version = "1.91.1"

keywords = ["msrv", "rust-version", "toolchain", "find", "minimum"]
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]

build = "build.rs"
exclude = ["/design"]

[package.metadata.release]
tag-name = "v{{version}}"

# ~~~ deps ~~~

[dependencies]
# workspace
cargo-msrv-cli = { path = "crates/cargo-msrv-cli", version = "0.19.3" } # the command line interface
cargo-msrv-types = { path = "crates/cargo-msrv-types", version = "0.19.3" } # the types shared with the command line interface

# external
bisector = "0.4.0" # bisection with a custom comparator
camino = "1.2" # utf-8 paths
cargo_metadata = "0.23.1" # resolving Cargo manifest metadata (consider `guppy`!)
ctrlc = "3.5.1" # interrupt handling
dirs = "6.0.0" # common directories
dunce = "1.0.5" # better canonicalize for Windows
indicatif = "0.18.4" # UI
owo-colors = "4.3.0" # color support for the terminal
petgraph = "0.8.3" # graph data structures
rust-releases = { workspace = true, features = ["rust-changelog"] } # get the available rust versions
serde = { workspace = true } # serialization and deserialization
serde_json = "1.0.150"  # JSON serialization and deserialization
storyteller = "2.0.0-beta.1" # minimal multi user output architecture
tabled = { version = "~0.16.0", features = ["ansi"] } # pretty print tables
terminal_size = "0.4.3" # determine the terminal size
thiserror = { workspace = true } # error handling
toml_edit = "0.25.5" # read and write the Cargo.toml
tracing = { workspace = true } # tracing
tracing-appender = "0.2" # tracing
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
assert_fs = "1.1.3"
yare = { workspace = true }
phenomenon = "~1.0.0"
parameterized = { workspace = true }


[build-dependencies]
vergen = { version = "8.3.2", default-features = false, features = ["build", "cargo", "git", "gitcl", "rustc"] }

# ~~~ features ~~~

[features]
default = ["rust-releases-dist-source"]
rust-releases-dist-source = ["rust-releases/rust-dist", "cargo-msrv-cli/rust-releases-dist-source"]

# ~~~ workspace ~~~

[workspace]
members = ["crates/cargo-msrv-cli", "crates/cargo-msrv-types", "crates/msrv"]

[workspace.package]
version = "0.19.3"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/foresterre/cargo-msrv"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
clap-cargo = { version = "0.18.3", features = ["cargo_metadata"] }
indoc = "2.0.7"
parameterized = "2.1.0"
rust-releases = { version = "0.32.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1"
yare = "3.0.0"

# ~~~ profile ~~~

[profile.release]
lto = true
codegen-units = 1
