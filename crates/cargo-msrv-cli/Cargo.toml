[package]
name = "cargo-msrv-cli"
description = "Command line interface of cargo-msrv"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

rust-version = "1.91.1"

keywords = ["msrv", "rust-version", "cargo-msrv", "cli", "minimum"]
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
cargo-msrv-context = { workspace = true }
cargo-msrv-types = { workspace = true }

camino = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
dunce = { workspace = true }
indoc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
yare = { workspace = true }

[features]
# Enables the `rust-dist` release source as a value of the `--release-source` option
rust-releases-dist-source = ["cargo-msrv-context/rust-releases-dist-source"]

