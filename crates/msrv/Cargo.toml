[package]
name = "msrv"
description = "A data type for the minimum supported Rust version (MSRV)"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

rust-version = "1.94"

keywords = ["msrv", "rust-version", "cargo-msrv", "datatype", "minimum"]
