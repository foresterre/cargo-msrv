[package]
name = "cargo-msrv-reporter"
description = "User facing output of cargo-msrv"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

keywords = ["msrv", "rust-version", "cargo-msrv", "reporter", "minimum"]
categories = ["development-tools", "development-tools::cargo-plugins"]
rust-version = "1.94"

[dependencies]
cargo-msrv-context = { workspace = true }
cargo-msrv-rust-tools = { workspace = true }
cargo-msrv-types = { workspace = true }
msrv = { workspace = true, features = ["serde"] }

camino = { workspace = true }
cargo_metadata = { workspace = true }
comfy-table = { version = "8.0.1", default-features = false, features = ["custom_styling"] }
indicatif = "0.18.4"
owo-colors = { workspace = true }
petgraph = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
storyteller = { workspace = true }
terminal_size = "0.4.3"
version-number = { workspace = true, features = ["semver", "serde"] }

[dev-dependencies]
yare = { workspace = true }

[features]
# Enables the `rust-changelog` release source
rust-releases-changelog-source = ["cargo-msrv-context/rust-releases-changelog-source"]

# Enables the `rust-dist` release source
rust-releases-dist-source = ["cargo-msrv-context/rust-releases-dist-source"]

# Enables the `github` release source
rust-releases-github-source = ["cargo-msrv-context/rust-releases-github-source"]

# Enables the test reporters and event handlers, for use by dependent crates
testing = []
