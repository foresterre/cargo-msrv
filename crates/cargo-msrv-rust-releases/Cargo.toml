[package]
name = "cargo-msrv-rust-releases"
description = "The index of available Rust releases for cargo-msrv"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

rust-version = "1.96.0"

keywords = ["msrv", "rust-version", "cargo-msrv", "rust-releases", "minimum"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[dependencies]
cargo-msrv-context = { workspace = true }
cargo-msrv-reporter = { workspace = true }
cargo-msrv-types = { workspace = true }

rust-releases = { workspace = true, features = ["bundled"] }
semver = { workspace = true }
storyteller = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3.55", default-features = false, features = ["std"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
parameterized = { workspace = true }
yare = { workspace = true }

[features]
# Enables the `rust-changelog` release source
rust-releases-changelog-source = [
    "rust-releases/rust-changelog",
    "rust-releases/ureq",
    "dep:time",
    "cargo-msrv-context/rust-releases-changelog-source",
    "cargo-msrv-reporter/rust-releases-changelog-source",
]

# Enables the `rust-dist` release source
rust-releases-dist-source = [
    "rust-releases/rust-dist",
    "dep:time",
    "cargo-msrv-context/rust-releases-dist-source",
    "cargo-msrv-reporter/rust-releases-dist-source",
]

# Enables the `github` release source
rust-releases-github-source = [
    "rust-releases/github",
    "rust-releases/ureq",
    "dep:time",
    "cargo-msrv-context/rust-releases-github-source",
    "cargo-msrv-reporter/rust-releases-github-source",
]
