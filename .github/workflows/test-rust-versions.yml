name: "ci-test-rust-versions"
on:
  workflow_dispatch:
  schedule:
    - cron: "00 04 * * 6"
permissions:
  contents: read

jobs:
  test_rust_versions:
    name: test_rust_versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: fetch
        run: |
          cargo fetch --verbose
          cargo fetch --verbose --manifest-path crates/cargo-msrv-test-rust-versions/Cargo.toml

      - name: test_rust_versions
        run: cargo test --verbose --manifest-path crates/cargo-msrv-test-rust-versions/Cargo.toml -- --test-threads=1
