name: "ci-test"
on:
  pull_request:
  push:
    branches:
      - master
      - main
  merge_group:
  schedule:
    - cron: "00 05 * * *"
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [ubuntu-stable, macos-stable, win-msvc-stable] # win-gnu-stable
        include:
          - build: ubuntu-stable
            os: ubuntu-latest
            rust: stable

          - build: macos-stable
            os: macos-latest
            rust: stable

          # FIXME: This is currently broken, see below.
          # * https://github.com/foresterre/cargo-msrv/pull/842
          # * https://github.com/rust-lang/rust/issues/112368
          #          - build: win-gnu-stable
          #            os: windows-latest
          #            rust: stable-x86_64-gnu

          - build: win-msvc-stable
            os: windows-latest
            rust: stable

    steps:
      - name: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-linux-musl

      - name: fetch
        run: cargo fetch --verbose

      - name: build
        run: cargo build --verbose

      - name: install musl-gcc
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: musl-tools # provides musl-gcc
          version: 1.0

      - name: build using musl
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --verbose --target=x86_64-unknown-linux-musl

      - name: test_all
        run: cargo test --verbose --all -- --test-threads=1
