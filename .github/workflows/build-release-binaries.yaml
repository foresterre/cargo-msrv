name: "ci-build-release-binaries"

on:
  release:
    types: [created]

jobs:
  build_binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # Prevent building on the latest GLIBC. There's not really a need to, and Debian 12 users are still behind
            archive_ext: tgz
            kind: linux

          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04 # Prevent building on the latest GLIBC. There's not really a need to, and Debian 12 users are still behind
            archive_ext: tgz
            kind: linux

          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tgz
            kind: macos

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tgz
            kind: macos

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            kind: windows

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: checkout_tagged_commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.target_commitish }}

      - name: set_output
        id: set_output
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          echo "archive=cargo-msrv-${BUILD_TARGET}-${TAG}.${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"
          echo "subfolder=cargo-msrv-${BUILD_TARGET}-${TAG}" >> "$GITHUB_OUTPUT"

      - name: show_outputs
        shell: bash
        env:
          ARCHIVE: ${{ steps.set_output.outputs.archive }}
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: |
          echo "Archive: '${ARCHIVE}'"
          echo "Subfolder: '${SUBFOLDER}'"

      - name: create_pkg_subfolder
        shell: bash
        env:
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: mkdir "$SUBFOLDER"

      - name: copy_files_to_pkg_subfolder
        shell: bash
        env:
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: |
          cp LICENSE-APACHE "$SUBFOLDER"
          cp LICENSE-MIT "$SUBFOLDER"
          cp README.md "$SUBFOLDER"

      - name: install_rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install musl-gcc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools # provides musl-gcc

      - name: build_${{ matrix.target }}_release_binary
        shell: bash
        run: cargo build --target="$BUILD_TARGET" --release

      - name: install_cargo_about
        shell: bash
        run: cargo install --locked cargo-about --features cli

      - name: generate_dep_licenses_file
        shell: bash
        env:
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: cargo about generate --output-file "${SUBFOLDER}/third-party-licenses.html" about.hbs

      - name: pack_archive_macos
        if: matrix.kind == 'macos'
        shell: bash
        env:
          ARCHIVE: ${{ steps.set_output.outputs.archive }}
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: |
          cp  "./target/${BUILD_TARGET}/release/cargo-msrv" "$SUBFOLDER"
          gtar --create --gzip --file="$ARCHIVE" "$SUBFOLDER"

      - name: pack_archive_linux
        if: matrix.kind == 'linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.set_output.outputs.archive }}
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: |
          cp "target/${BUILD_TARGET}/release/cargo-msrv" "$SUBFOLDER"
          tar --create --gzip --file="$ARCHIVE" "$SUBFOLDER"

      - name: pack_archive_windows
        if: matrix.kind == 'windows'
        shell: bash
        env:
          ARCHIVE: ${{ steps.set_output.outputs.archive }}
          SUBFOLDER: ${{ steps.set_output.outputs.subfolder }}
        run: |
          cp "target/${BUILD_TARGET}/release/cargo-msrv.exe" "./${SUBFOLDER}"
          7z a -tzip "$ARCHIVE" "$SUBFOLDER"

      - name: upload_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ steps.set_output.outputs.archive }}
        run: gh release upload "$TAG" "./$ARCHIVE" --repo "$GITHUB_REPOSITORY"
